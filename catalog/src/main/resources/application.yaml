spring:
  application:
    name: catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
server:
  port: 8081
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: '*'
catalog:
  page-size: 2
